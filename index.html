<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilgesu Çakır — Software Development Engineer</title>
<meta name="description" content="Portfolio of Bilgesu Çakır, software development engineer in Istanbul.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE — edit these six and the whole site follows
   ============================================================ */
:root{
  --plum-deep:#887caf;
  --plum-mid:#9688c0;
  --wisteria:#a596d3;
  --wisteria-lt:#b6a5e8;
  --mauve:#c8b6ff;
  --periwinkle:#cdbdff;

  --ink:#2c2640;
  --ink-soft:#5b5478;
  --ink-faint:#8b83a6;
  --paper:#faf8ff;
  --paper-dim:#f3effc;
  --paper-dim-2:#ebe4fa;

  --serif:'Fraunces',Georgia,serif;
  --sans:'Sora',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;

  --shadow-lg:0 24px 56px rgba(44,38,64,.20);
  --shadow-md:0 10px 26px rgba(44,38,64,.14);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);
  line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
a{color:var(--plum-deep);text-underline-offset:3px}
button{font-family:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--plum-deep);outline-offset:3px;border-radius:4px}
img{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ambient ---------- */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 34s ease-in-out infinite}
.b1{width:540px;height:540px;background:var(--mauve);top:-220px;left:-200px;opacity:.24}
.b2{width:440px;height:440px;background:var(--wisteria-lt);bottom:-200px;right:-180px;opacity:.2;animation-delay:-12s}
.b3{width:340px;height:340px;background:var(--periwinkle);top:45%;left:38%;opacity:.14;animation-delay:-22s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(34px,-42px) scale(1.09)}66%{transform:translate(-28px,26px) scale(.94)}}

/* ============================================================
   LAYOUT
   ============================================================ */
.stage{
  display:grid;grid-template-columns:308px minmax(0,1fr);
  gap:clamp(30px,5vw,74px);
  max-width:1140px;margin:0 auto;
  padding:clamp(24px,5vw,64px) clamp(18px,4vw,48px) 90px;
  align-items:start;
}
@media(max-width:900px){
  .stage{grid-template-columns:1fr;gap:30px;justify-items:center}
  .panel-col{width:100%}
}

/* ============================================================
   THE iPOD
   ============================================================ */
.ipod-col{position:sticky;top:clamp(24px,5vw,52px);justify-self:center}
@media(max-width:900px){.ipod-col{position:static}}

.ipod{
  width:290px;padding:19px 19px 24px;border-radius:34px;
  background:linear-gradient(163deg,#fefdff 0%,#f4f0fd 42%,#e7dffa 100%);
  box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(136,124,175,.22);
}

/* screen */
.screen{
  height:228px;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;
  background:#f8f5ff;
  border:1px solid rgba(136,124,175,.4);
  box-shadow:inset 0 2px 9px rgba(44,38,64,.13),0 1px 0 rgba(255,255,255,.8);
  position:relative;
}
.statusbar{
  flex:0 0 21px;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;font-size:.6rem;letter-spacing:.01em;color:var(--ink-soft);
  background:linear-gradient(180deg,#e9e1fb,#dcd2f6);
  border-bottom:1px solid rgba(136,124,175,.3);
}
.statusbar .title{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.battery{width:17px;height:9px;border:1px solid var(--ink-soft);border-radius:2px;position:relative;flex:0 0 auto}
.battery::after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:5px;background:var(--ink-soft);border-radius:0 1px 1px 0}
.battery i{display:block;height:100%;width:78%;background:var(--plum-mid);border-radius:1px}

.screen-body{flex:1;position:relative;overflow:hidden}

/* menu list */
.menu{position:absolute;inset:0;overflow-y:auto;padding:3px 0;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu ul{margin:0;padding:0;list-style:none}
.menu li{
  padding:6px 11px;font-size:.79rem;display:flex;align-items:center;gap:8px;
  color:var(--ink);cursor:pointer;transition:background .12s,color .12s;
}
.menu li .emoji{font-size:.85rem;flex:0 0 auto;filter:grayscale(.15)}
.menu li .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu li .arrow{opacity:.45;font-size:.72rem}
.menu li.sel{background:linear-gradient(180deg,var(--wisteria-lt),var(--plum-mid));color:#fff}
.menu li.sel .arrow{opacity:.95}
.menu li.sel .emoji{filter:none}

/* now-playing screen */
.nowplaying{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:12px;text-align:center;
  background:linear-gradient(170deg,#f8f5ff,#efe9fc)}
.nowplaying.on{display:flex;animation:npin .3s ease}
@keyframes npin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.np-art{width:82px;height:82px;border-radius:6px;display:grid;place-items:center;font-size:2rem;
  box-shadow:0 6px 14px rgba(44,38,64,.22);overflow:hidden;background:var(--wisteria)}
.np-art img{width:100%;height:100%;object-fit:cover}
.np-title{font-family:var(--serif);font-size:.9rem;margin-top:10px;line-height:1.2}
.np-sub{font-size:.65rem;color:var(--ink-soft);margin-top:2px}
.np-track{width:80%;height:3px;border-radius:3px;background:rgba(136,124,175,.28);margin-top:11px;overflow:hidden}
.np-track i{display:block;height:100%;background:var(--plum-mid);transition:width .4s ease}
.np-count{font-size:.58rem;color:var(--ink-faint);margin-top:5px}

/* click wheel */
.wheel{
  width:194px;height:194px;border-radius:50%;margin:22px auto 0;position:relative;
  background:radial-gradient(circle at 50% 32%,#fdfcff,#e8e0fa 74%,#ddd3f5);
  box-shadow:0 3px 12px rgba(44,38,64,.17),inset 0 1px 0 #fff,0 0 0 1px rgba(136,124,175,.2);
  touch-action:none;user-select:none;
}
.wheel .wbtn{
  position:absolute;background:none;border:none;cursor:pointer;color:var(--ink-soft);
  font-size:.66rem;letter-spacing:.08em;padding:9px 13px;border-radius:12px;
  transition:color .18s,background .18s;
}
.wheel .wbtn:hover{color:var(--plum-deep);background:rgba(200,182,255,.35)}
.wheel .wbtn:active{background:rgba(200,182,255,.6)}
.w-menu{top:5px;left:50%;transform:translateX(-50%)}
.w-prev{left:0;top:50%;transform:translateY(-50%);font-size:.9rem!important}
.w-next{right:0;top:50%;transform:translateY(-50%);font-size:.9rem!important}
.w-play{bottom:3px;left:50%;transform:translateX(-50%);font-size:.9rem!important}
.center{
  position:absolute;inset:60px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(163deg,#f8f5ff,#ddd2f7);
  box-shadow:inset 0 1px 3px rgba(44,38,64,.2),0 1px 2px rgba(255,255,255,.7);
  transition:transform .14s,box-shadow .14s;
}
.center:hover{transform:scale(1.035)}
.center:active{transform:scale(.97);box-shadow:inset 0 2px 6px rgba(44,38,64,.28)}

.ipod-foot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px}
.ipod-foot p{font-size:.66rem;color:var(--ink-faint);margin:0;text-align:center;line-height:1.5}
.sound{border:1px solid rgba(136,124,175,.4);background:var(--paper);border-radius:999px;
  font-size:.64rem;padding:4px 10px;color:var(--ink-soft);cursor:pointer;transition:background .2s;flex:0 0 auto}
.sound:hover{background:var(--paper-dim)}
.sound[aria-pressed="true"]{background:var(--mauve);color:var(--ink);border-color:transparent}

/* ============================================================
   CONTENT PANEL
   ============================================================ */
.panel{min-height:66vh;max-width:640px}
.view{display:none}
.view.on{display:block;animation:viewin .5s cubic-bezier(.22,.61,.36,1)}
@keyframes viewin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.crumb{font-size:.76rem;color:var(--plum-deep);margin:0 0 8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:none;padding:0;color:var(--plum-deep);cursor:pointer;font-size:.76rem}
.crumb button:hover{text-decoration:underline}
.crumb .sep{opacity:.5}

.view h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.85rem,4.4vw,2.6rem);
  margin:0;line-height:1.12;letter-spacing:-.018em}
.view .lede{font-size:1.03rem;margin:16px 0 0;color:var(--ink-soft);max-width:56ch}

h2.entry{font-family:var(--serif);font-weight:500;font-size:1.1rem;margin:24px 0 1px}
h2.entry:first-of-type{margin-top:26px}
.meta{font-size:.82rem;color:var(--plum-deep);margin:0}
.view p{color:var(--ink-soft);margin:9px 0 0;font-size:.96rem;max-width:58ch}
.view ul.bullets{margin:11px 0 0;padding-left:1.15em;color:var(--ink-soft);font-size:.95rem;max-width:58ch}
.view ul.bullets li{margin-bottom:6px}
.rule{height:1px;background:rgba(136,124,175,.22);margin:24px 0}

.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.chip{font-size:.84rem;padding:6px 15px;border-radius:999px;background:var(--paper-dim);
  border:1px solid rgba(136,124,175,.3);transition:background .25s,transform .25s}
.chip:hover{background:var(--mauve);transform:translateY(-2px)}
.chip.head{background:transparent;border:none;color:var(--plum-deep);padding-left:0;font-size:.8rem}

.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.links a{font-size:.9rem;padding:8px 18px;border-radius:999px;text-decoration:none;color:var(--ink);
  border:1px solid rgba(136,124,175,.4);transition:background .25s,transform .25s}
.links a:hover{background:var(--mauve);transform:translateY(-2px)}

/* --- media --- */
.hero-img{border-radius:18px;overflow:hidden;margin-top:22px;box-shadow:var(--shadow-md);
  background:linear-gradient(150deg,var(--periwinkle),var(--wisteria));aspect-ratio:16/9}
.hero-img img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.92);
  font-size:.78rem;text-align:center;padding:14px;line-height:1.5;
  background:linear-gradient(150deg,var(--periwinkle),var(--wisteria))}
.ph .big{font-size:1.9rem;display:block;margin-bottom:6px}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;margin-top:18px}
.shots figure{margin:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);
  aspect-ratio:1;background:var(--paper-dim);transition:transform .3s}
.shots figure:hover{transform:translateY(-4px)}
.shots img{width:100%;height:100%;object-fit:cover}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px;margin-top:20px}
.gallery figure{margin:0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);
  aspect-ratio:1;cursor:zoom-in;transition:transform .3s;background:var(--paper-dim)}
.gallery figure:hover{transform:translateY(-4px) scale(1.02)}
.gallery img{width:100%;height:100%;object-fit:cover}

/* project list rows */
.plist{margin-top:22px}
.prow{display:flex;gap:15px;align-items:center;padding:13px 12px;border-radius:15px;
  cursor:pointer;text-align:left;width:100%;background:none;border:none;
  transition:background .22s,transform .22s}
.prow:hover{background:var(--paper-dim);transform:translateX(3px)}
.prow .art{flex:0 0 54px;height:54px;border-radius:10px;display:grid;place-items:center;
  font-size:1.3rem;overflow:hidden;box-shadow:0 4px 10px rgba(44,38,64,.16)}
.prow .art img{width:100%;height:100%;object-fit:cover}
.prow .txt{flex:1;min-width:0}
.prow .txt strong{font-family:var(--serif);font-weight:500;font-size:1rem;display:block}
.prow .txt span{font-size:.8rem;color:var(--ink-soft);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prow .go{color:var(--plum-deep);font-size:.9rem;flex:0 0 auto}
.status{display:inline-block;font-size:.66rem;padding:2px 9px;border-radius:999px;
  background:var(--plum-deep);color:#fff;margin-left:8px;vertical-align:middle}
.status.soft{background:var(--paper-dim-2);color:var(--plum-deep)}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(44,38,64,.72);backdrop-filter:blur(6px);
  display:none;place-items:center;padding:26px;z-index:80;cursor:zoom-out}
.lightbox.on{display:grid;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lightbox img,.lightbox .ph{max-width:min(880px,92vw);max-height:84vh;border-radius:16px;
  box-shadow:0 30px 70px rgba(0,0,0,.4);width:auto;height:auto;aspect-ratio:1}

footer{max-width:1140px;margin:0 auto;padding:0 clamp(18px,4vw,48px) 60px;
  font-size:.78rem;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="stage">

  <!-- ============ iPOD ============ -->
  <div class="ipod-col">
    <div class="ipod">
      <div class="screen">
        <div class="statusbar">
          <span class="title" id="npTitle">Bilgesu Çakır</span>
          <span class="battery"><i></i></span>
        </div>
        <div class="screen-body">
          <div class="menu" id="menuWrap" role="listbox" aria-label="iPod menu"><ul id="menuList"></ul></div>
          <div class="nowplaying" id="np">
            <div class="np-art" id="npArt"></div>
            <div class="np-title" id="npName"></div>
            <div class="np-sub" id="npSub"></div>
            <div class="np-track"><i id="npBar"></i></div>
            <div class="np-count" id="npCount"></div>
          </div>
        </div>
      </div>

      <div class="wheel" id="wheel">
        <button class="wbtn w-menu" id="bMenu">MENU</button>
        <button class="wbtn w-prev" id="bPrev" aria-label="Previous item">◀◀</button>
        <button class="wbtn w-next" id="bNext" aria-label="Next item">▶▶</button>
        <button class="wbtn w-play" id="bPlay" aria-label="Now playing">▶‖</button>
        <button class="center" id="bCenter" aria-label="Select"></button>
      </div>

      <div class="ipod-foot">
        <p>Drag the wheel to scroll<br>centre to select · MENU to go back</p>
        <button class="sound" id="sound" aria-pressed="false">click</button>
      </div>
    </div>
  </div>

  <!-- ============ PANEL ============ -->
  <div class="panel-col">
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
</div>

<footer id="foot"></footer>

<div class="lightbox" id="lightbox"><div id="lbInner"></div></div>

<script>
/* ============================================================
   CONTENT — everything you edit lives in this one object.
   `art`  : {emoji, img}  → img is optional, drop files in images/
   `html` : the right-hand panel content
   ============================================================ */

const IMG = (src, alt, emoji, label) => `
  <img src="${src}" alt="${alt}" loading="lazy"
       onerror="this.outerHTML='<div class=\\'ph\\'><span class=\\'big\\'>${emoji}</span>${label}</div>'">`;

const NODES = {

  root:{ label:'iPod', children:['about','education','experience','capstone','projects','photos','tools','offclock','contact'] },

  about:{
    label:'About me', emoji:'👋',
    art:{emoji:'👋', img:'images/portrait.jpg'},
    title:'Bilgesu Çakır', kicker:'Istanbul, Turkey',
    html:`
      <p class="lede">Software Development Engineer. I build backend systems by day — currently at
      Hepsiburada, previously on Amadeus's Order Management System — and spend my off hours shipping
      small side projects, crocheting, and hunting down the next film to watch.</p>
      <div class="hero-img">${IMG('images/portrait.jpg','Bilgesu Çakır','👋','images/portrait.jpg')}</div>
      <div class="links">
        <a href="mailto:your-email@example.com">Email</a>
        <a href="https://github.com/bilgesucakir" target="_blank" rel="noopener">GitHub</a>
        <a href="#" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://letterboxd.com/bilgesucakir" target="_blank" rel="noopener">Letterboxd</a>
      </div>`
  },

  education:{
    label:'Education', emoji:'🎓',
    art:{emoji:'🎓'},
    title:'Where it started', kicker:'Education',
    html:`
      <h2 class="entry">B.S. Computer Science &amp; Engineering</h2>
      <p class="meta">Sabancı University · Graduated June 2023</p>
      <p>Four years of computer science, ending in the capstone project listed separately in this menu.</p>`
  },

  experience:{
    label:'Experience', emoji:'💼',
    art:{emoji:'💼'},
    title:"Where I've worked", kicker:'Experience',
    html:`
      <h2 class="entry">Software Development Engineer</h2>
      <p class="meta">Hepsiburada · Current</p>
      <p>Details to add.</p>
      <div class="rule"></div>
      <h2 class="entry">Associate Software Development Engineer</h2>
      <p class="meta">Amadeus, Istanbul · Jul 2025 – Jun 2026</p>
      <p>Promoted from Junior after a year and a half on the same team.</p>
      <div class="rule"></div>
      <h2 class="entry">Junior Software Development Engineer</h2>
      <p class="meta">Amadeus, Istanbul · Feb 2024 – Jun 2025</p>
      <ul class="bullets">
        <li>Order Management System — moving ticket/PNR flows onto the IATA Order standard</li>
        <li>Cloud-based Java services with Quarkus, running on Kubernetes</li>
        <li>1st place, internal Amadeus bug bounty — security and privacy testing on a live system</li>
        <li>2nd place, Amadeus Community Impact Hackathon 2024 with AYDER — accessibility-focused app, Flutter frontend and Java backend</li>
      </ul>`
  },

  capstone:{
    label:'Graduation project', emoji:'📘',
    art:{emoji:'📘', img:'images/capstone.jpg'},
    title:'Senior capstone', kicker:'Graduation project',
    html:`
      <h2 class="entry">Project title goes here</h2>
      <p class="meta">Sabancı University · 2022–2023</p>
      <p>A short description of the problem, what you built, and how it turned out.</p>
      <div class="hero-img">${IMG('images/capstone.jpg','Graduation project','📘','images/capstone.jpg')}</div>
      <div class="chips"><span class="chip">Tech 1</span><span class="chip">Tech 2</span><span class="chip">Tech 3</span></div>`
  },

  projects:{
    label:'Side projects', emoji:'📁', arrow:true,
    art:{emoji:'📁'},
    children:['p-watch','p-veni','p-account','p-jetlag','p-interview'],
    title:'What I build for fun', kicker:'Side projects',
    html:`<p class="lede">Five things in various states of done. Pick one from the wheel, or tap a row below.</p>`
  },

  'p-watch':{
    label:"What We'll Watch Tonight", emoji:'🎬', parent:'projects',
    art:{emoji:'🎬', img:'images/watch-cover.jpg'},
    title:"What We'll Watch Tonight", kicker:'Side project · shipped',
    blurb:'Letterboxd watchlist intersection · Spring Boot + Vue',
    html:`
      <p class="lede">Compares 2–4 people's Letterboxd watchlists and returns the films everyone already
      wants to see, linking straight back to each film's Letterboxd page.</p>
      <div class="hero-img">${IMG('images/watch-cover.jpg',"What We'll Watch Tonight",'🎬','images/watch-cover.jpg')}</div>
      <p>It started as a very specific annoyance: two people, two long watchlists, forty minutes of
      scrolling and nothing agreed on. The app checks whether each watchlist is public, pulls them,
      and returns the overlap.</p>
      <div class="shots">
        <figure>${IMG('images/watch-1.jpg','Screenshot','🖼','watch-1.jpg')}</figure>
        <figure>${IMG('images/watch-2.jpg','Screenshot','🖼','watch-2.jpg')}</figure>
        <figure>${IMG('images/watch-3.jpg','Screenshot','🖼','watch-3.jpg')}</figure>
      </div>
      <div class="chips"><span class="chip head">Built with</span><span class="chip">Spring Boot</span><span class="chip">Vue</span><span class="chip">Render</span></div>
      <div class="links">
        <a href="https://what-we-will-watch-tonight.onrender.com" target="_blank" rel="noopener">Open the app</a>
        <a href="https://github.com/bilgesucakir/what-we-will-watch-tonight" target="_blank" rel="noopener">Source</a>
      </div>`
  },

  'p-veni':{
    label:'veni vidi ami', emoji:'🗺', parent:'projects',
    art:{emoji:'🗺', img:'images/veni-cover.jpg'},
    title:'veni vidi ami', kicker:'Side project · early stage',
    blurb:'Secondhand marketplace map · Spring Boot + Vue',
    html:`
      <p class="lede">A map-based aggregator that pulls listings from Sahibinden, Dolap and other local
      secondhand marketplaces and plots them by area — browsing finds by map instead of scrolling
      five apps.</p>
      <div class="hero-img">${IMG('images/veni-cover.jpg','veni vidi ami','🗺','images/veni-cover.jpg')}</div>
      <p>Named for <em>i came, i saw, i bought</em>. The idea borrows Cimri's price-comparison model
      and applies it to location instead of price.</p>
      <div class="chips"><span class="chip head">Planned stack</span><span class="chip">Spring Boot</span><span class="chip">Vue</span><span class="chip">Leaflet / MapLibre</span></div>`

/* ============================================================
   ENGINE
   ============================================================ */
const $=id=>document.getElementById(id);
const menuList=$('menuList'), menuWrap=$('menuWrap'), panel=$('panel');
const npEl=$('np');

let stack=['root'];              // menu path
let cursor=0;                    // highlighted row in current menu
let current=null;                // id of the node shown in the panel
let clickSound=false;

const node=id=>NODES[id];
const currentMenu=()=>node(stack[stack.length-1]).children;

/* --- tick sound (Web Audio, no files) --- */
let ac=null;
function tick(){
  if(!clickSound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=1750;
    g.gain.setValueAtTime(.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.028);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.03);
  }catch(e){}
}

/* --- render the small screen --- */
function renderMenu(){
  const ids=currentMenu();
  menuList.innerHTML=ids.map((id,i)=>{
    const n=node(id);
    return `<li class="${i===cursor?'sel':''}" data-i="${i}" role="option" aria-selected="${i===cursor}">
      <span class="emoji">${n.emoji||'•'}</span>
      <span class="lbl">${n.label}</span>
      <span class="arrow">${n.arrow?'›':''}</span></li>`;
  }).join('');
  $('npTitle').textContent = stack.length>1 ? node(stack[stack.length-1]).label : 'Bilgesu Çakır';
  const sel=menuList.querySelector('.sel');
  if(sel)sel.scrollIntoView({block:'nearest'});
  npEl.classList.remove('on');
}

/* --- now-playing screen --- */
function renderNP(){
  const n=node(current); if(!n)return;
  const art=n.art||{emoji:'♪'};
  $('npArt').innerHTML = art.img
    ? `<img src="${art.img}" alt="" onerror="this.parentElement.textContent='${art.emoji}'">`
    : art.emoji;
  $('npName').textContent=n.label;
  $('npSub').textContent=n.kicker||'';
  const ids=currentMenu(), i=ids.indexOf(current);
  $('npBar').style.width=ids.length?`${((i+1)/ids.length)*100}%`:'0%';
  $('npCount').textContent = i>=0 ? `${i+1} of ${ids.length}` : '';
  npEl.classList.add('on');
}

/* --- panel --- */
function crumbHTML(id){
  const n=node(id), bits=[];
  if(n.parent) bits.push(`<button data-goto="${n.parent}">${node(n.parent).label}</button><span class="sep">›</span>`);
  bits.push(`<span>${n.kicker||n.label}</span>`);
  return `<p class="crumb">${bits.join('')}</p>`;
}
function childRows(id){
  const kids=node(id).children||[];
  return `<div class="plist">`+kids.map(k=>{
    const c=node(k), art=c.art||{};
    return `<button class="prow" data-goto="${k}">
      <span class="art" style="background:linear-gradient(150deg,var(--periwinkle),var(--wisteria))">${
        art.img?`<img src="${art.img}" alt="" onerror="this.parentElement.textContent='${art.emoji||'♪'}'">`:(art.emoji||'♪')
      }</span>
      <span class="txt"><strong>${c.label}</strong><span>${c.blurb||c.kicker||''}</span></span>
      <span class="go">›</span></button>`;
  }).join('')+`</div>`;
}
function renderPanel(id){
  const n=node(id);
  panel.innerHTML=`<div class="view on">
    ${crumbHTML(id)}
    <h1>${n.title||n.label}</h1>
    ${n.html||''}
    ${n.children?childRows(id):''}
  </div>`;
  $('foot').textContent=`${n.label} · Bilgesu Çakır · Istanbul, 2026`;
  document.title=`${n.label} — Bilgesu Çakır`;
}

/* --- navigation --- */
function show(id,{push=true}={}){
  current=id;
  renderPanel(id);
  renderNP();
  if(push&&location.hash.slice(1)!==id) history.replaceState(null,'',`#${id}`);
  if(window.innerWidth<=900){
    panel.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function move(d){
  const len=currentMenu().length;
  cursor=(cursor+d+len)%len;
  renderMenu();tick();
}
function select(){
  const id=currentMenu()[cursor];
  const n=node(id);
  tick();
  if(n.children){                 // drill in, but still show its overview
    show(id);
    stack.push(id);cursor=0;renderMenu();
  }else{
    show(id);
  }
}
function back(){
  tick();
  if(stack.length>1){
    const leaving=stack.pop();
    cursor=Math.max(0,currentMenu().indexOf(leaving));
    renderMenu();
  }else{
    if(npEl.classList.contains('on')) renderMenu();
    else{cursor=0;renderMenu()}
  }
}

/* --- wheel: rotational drag --- */
const wheel=$('wheel');
let dragging=false, lastAngle=0, accum=0;
function angleAt(e){
  const r=wheel.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI;
}
wheel.addEventListener('pointerdown',e=>{
  if(e.target.closest('.wbtn')||e.target.closest('.center'))return;
  dragging=true;lastAngle=angleAt(e);accum=0;
  wheel.setPointerCapture(e.pointerId);
});
wheel.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const a=angleAt(e);
  let d=a-lastAngle;
  if(d>180)d-=360; if(d<-180)d+=360;
  accum+=d;lastAngle=a;
  while(Math.abs(accum)>=26){
    move(accum>0?1:-1);
    accum+=accum>0?-26:26;
  }
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  wheel.addEventListener(ev,()=>dragging=false));

/* --- buttons --- */
$('bNext').onclick=()=>move(1);
$('bPrev').onclick=()=>move(-1);
$('bCenter').onclick=select;
$('bMenu').onclick=back;
$('bPlay').onclick=()=>{ if(current) renderNP(); tick(); };
menuWrap.addEventListener('click',e=>{
  const li=e.target.closest('li'); if(!li)return;
  cursor=+li.dataset.i; renderMenu(); select();
});

/* --- panel links that navigate --- */
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-goto]'); if(!b)return;
  const id=b.dataset.goto, n=node(id);
  // sync the iPod menu to wherever we jumped
  stack = n.parent ? ['root',n.parent] : ['root'];
  if(n.children && !n.parent) stack=['root'];
  cursor=Math.max(0,currentMenu().indexOf(id));
  renderMenu();
  if(n.children){show(id);stack.push(id);cursor=0;renderMenu()}
  else show(id);
});

/* --- keyboard --- */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowDown'){e.preventDefault();move(1)}
  if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
  if(e.key==='ArrowRight'||e.key==='Enter'){
    if(document.activeElement===document.body||e.key==='ArrowRight'){e.preventDefault();select()}
  }
  if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();back()}
});

/* --- sound toggle --- */
$('sound').onclick=e=>{
  clickSound=!clickSound;
  e.currentTarget.setAttribute('aria-pressed',String(clickSound));
  tick();
};

/* --- lightbox --- */
const lb=$('lightbox'), lbInner=$('lbInner');
panel.addEventListener('click',e=>{
  const fig=e.target.closest('.gallery figure'); if(!fig)return;
  lbInner.innerHTML=fig.innerHTML;lb.classList.add('on');
});
lb.addEventListener('click',()=>lb.classList.remove('on'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});

/* --- boot (respects #deep-links) --- */
(function boot(){
  const hash=location.hash.slice(1);
  const start=NODES[hash]?hash:'about';
  const n=node(start);
  stack = n.parent?['root',n.parent]:['root'];
  cursor=Math.max(0,currentMenu().indexOf(start));
  renderMenu();
  show(start,{push:false});
})();
</script>
